name: Lighthouse
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static site
        run: npm run build
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Lighthouse (desktop)
        run: npx --yes @lhci/cli@0.16.1 autorun --collect.settings.preset=desktop
