name: Lighthouse
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static site
        run: npm run build
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.16.1 autorun
      # Keep reports after a failure so a CI-only shift can be inspected.
      - name: Upload mobile reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Lighthouse (desktop)
        if: ${{ !cancelled() }}
        run: npx --yes @lhci/cli@0.16.1 autorun --collect.settings.preset=desktop
      - name: Upload desktop reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-desktop
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
